# Tunables for the mission nodes. Distances in metres, speeds in m/s and rad/s.

line_follower:
  ros__parameters:
    speed: 0.10              # default forward speed, a goal may override it
    kp: 45.0                 # rad/s per metre of line offset
    kd: 2.0                  # rad/s per (m/s) of offset change
    max_turn: 1.5
    search_turn: 0.6         # turn rate used to swing back after the line slips off the array
    min_darkness: 0.15       # readings lighter than this fraction are treated as floor
    dark_level: 0.5          # fraction that counts a channel as fully on black
    marker_channels: 6       # this many dark channels at once is a square or crossbar
    marker_samples: 2        # for this many samples in a row
    rate: 20.0               # Hz, same as the IR array

mission:
  ros__parameters:
    entry_speed: 0.10          # along the entry line
    entry_reach: 3.0           # give up if the start square has not turned up by then
    dock_speed: 0.05           # on the stems, slow enough to stop on the marker
    dock_reach: 0.60           # farthest to look for a marker from a station pose
    dock_attempts: 2
    qr_timeout: 4.0            # seconds
    gripper_open: -1.0         # rad
    gripper_closed: 0.09
    gripper_travel_time: 1.0   # seconds for the jaws to swing fully
