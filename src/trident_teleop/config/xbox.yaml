# Xbox controller mapping for trident teleop.
# Indices follow the Linux xpad driver as reported by joy_linux. Check with: ros2 topic echo /joy

joy_node:
  ros__parameters:
    deadzone: 0.1
    autorepeat_rate: 20.0   # keeps /cmd_vel flowing while a stick is held still
    dev_ff: ""              # no rumble, so no event device is opened

teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 4          # LB, hold to drive
    enable_turbo_button: 5    # RB, hold for full speed
    axis_linear:
      x: 1                    # left stick up/down
    scale_linear:
      x: 0.2                  # m/s
    scale_linear_turbo:
      x: 0.5
    axis_angular:
      yaw: 3                  # right stick left/right
    scale_angular:
      yaw: 1.5                # rad/s
    scale_angular_turbo:
      yaw: 3.0

gripper_teleop:
  ros__parameters:
    close_button: 0           # A
    open_button: 1            # B
    close_angle: 0.09         # rad, matches grip_upper in the xacro
    open_angle: -1.0          # rad, matches grip_lower in the xacro
