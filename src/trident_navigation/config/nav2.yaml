# Nav2 for a 20 cm diff drive robot in a 2.4 m room.
# Global plan with NavFn on the RTAB-Map grid, path tracking with Regulated Pure Pursuit,
# obstacles from the depth camera. Everything is slow and fine grained to suit the size.
#
# use_sim_time is spelled out in every node: the Nav2 bringup launch can only rewrite keys
# that already exist in this file.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # default_nav_to_pose_bt_xml is filled in by navigation.launch.py

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 15.0

    # Tight, because the line follower takes over from where Nav2 stops
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.02
      yaw_goal_tolerance: 0.05
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15
      lookahead_dist: 0.20
      min_lookahead_dist: 0.12
      max_lookahead_dist: 0.30
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.25
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.3
      regulated_linear_scaling_min_speed: 0.05
      # Turn on the spot first when the path starts well off the heading, and again at the goal
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.5
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 3.0
      # The camera only looks forward, so never plan to drive backwards
      allow_reversing: false
      max_robot_pose_search_dist: 1.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.05
      use_astar: false
      allow_unknown: true

# Shared by both costmaps: a decimated cloud made from the depth image.
# Points under 3 cm are floor, sensor noise or a coin, none of which should block a path.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 2          # whole metres, Humble takes integers here
      height: 2
      resolution: 0.02
      update_frequency: 10.0
      publish_frequency: 2.0
      robot_radius: 0.13
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: depth
        depth:
          topic: /camera/depth/points_nav
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.03
          max_obstacle_height: 0.40
          obstacle_min_range: 0.0
          obstacle_max_range: 2.0
          raytrace_min_range: 0.0
          raytrace_max_range: 2.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25
        cost_scaling_factor: 8.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.02
      update_frequency: 2.0
      publish_frequency: 1.0
      robot_radius: 0.13
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: depth
        depth:
          topic: /camera/depth/points_nav
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.03
          max_obstacle_height: 0.40
          obstacle_min_range: 0.0
          obstacle_max_range: 2.0
          raytrace_min_range: 0.0
          raytrace_max_range: 2.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25
        cost_scaling_factor: 8.0
      always_send_full_costmap: true

# Backup is loaded only because Nav2's stock "through poses" tree refuses to start without it.
# Our own tree (navigate_no_backup.xml) never calls it: the robot cannot see behind itself.
behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6        # slow spins give the SLAM camera overlapping views
    min_rotational_vel: 0.3
    rotational_acc_lim: 3.0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.20, 0.0, 1.5]
    min_velocity: [-0.20, 0.0, -1.5]
    max_accel: [0.5, 0.0, 3.0]
    max_decel: [-0.5, 0.0, -3.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0
