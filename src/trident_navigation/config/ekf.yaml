# robot_localization EKF: wheel encoders for forward speed, gyro for turn rate.
# The wheels slip when the robot spins on the spot, so their yaw rate is left out.
# Each sensor row is: x y z, roll pitch yaw, vx vy vz, vroll vpitch vyaw, ax ay az.

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]

    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    # Gravity is already absent from the planar terms we use
    imu0_remove_gravitational_acceleration: false
