# Ground truth poses of everything that can move in the arena, for the referee only.
# Nothing on the robot may use this topic.

- ros_topic_name: "/sim/poses"
  gz_topic_name: "/world/arena/dynamic_pose/info"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "ignition.msgs.Pose_V"
  direction: GZ_TO_ROS
