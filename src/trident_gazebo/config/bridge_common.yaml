# Bridge entries every world needs: clock, commands, joint states, camera and IR array.
# Odometry is bridged separately, see bridge_odom_raw.yaml and bridge_odom_ekf.yaml.
# ROS topic names on the camera match the realsense2_camera driver so the same nodes run on sim and hardware.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "ignition.msgs.Clock"
  direction: GZ_TO_ROS

# Commands keep a queue of 1 so only the newest one is used, never a stale backlog
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "ignition.msgs.Twist"
  direction: ROS_TO_GZ
  subscriber_queue: 1
  publisher_queue: 1

- ros_topic_name: "/joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "ignition.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/gripper/drive_cmd"
  gz_topic_name: "/gripper/drive_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ
  subscriber_queue: 1
  publisher_queue: 1

- ros_topic_name: "/gripper/follower_cmd"
  gz_topic_name: "/gripper/follower_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ
  subscriber_queue: 1
  publisher_queue: 1

- ros_topic_name: "/camera/color/image_raw"
  gz_topic_name: "/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "ignition.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/color/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "ignition.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/depth/image_rect_raw"
  gz_topic_name: "/camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "ignition.msgs.Image"
  direction: GZ_TO_ROS

# The point cloud is built in ROS from the depth image (depth_image_proc), not bridged.

# IR line sensor array, one small image per channel. ir_array.py reads these.
